<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Siswa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(180deg,#eef6ff,#ffffff);
      min-height: 100vh;
    }
    .card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }
    .menu-card {
      transition: .2s;
      cursor: pointer;
    }
    .menu-card:hover {
      transform: translateY(-4px);
    }
    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <!-- HEADER -->
  <div class="card p-4 mb-4 bg-primary text-white">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h4 class="mb-1">Hai, <span id="namaSiswa">Siswa</span> 👋</h4>
        <small>Kelas <span id="kelasSiswa">-</span></small>
      </div>
      <button id="logoutBtn" class="btn btn-light btn-sm">Logout</button>
    </div>
  </div>

  <!-- MENU -->
  <div class="row g-4">

    <div class="col-6 col-md-3">
      <a href="materi.html" class="text-decoration-none text-dark">
        <div class="card p-3 menu-card">
          <div class="icon-box bg-primary">
            <i class="bi bi-book"></i>
          </div>
          <h6>Materi</h6>
          <small class="text-muted">Belajar materi</small>
        </div>
      </a>
    </div>

    <div class="col-6 col-md-3">
      <a href="latihan.html" class="text-decoration-none text-dark">
        <div class="card p-3 menu-card">
          <div class="icon-box bg-success">
            <i class="bi bi-pencil-square"></i>
          </div>
          <h6>Latihan</h6>
          <small class="text-muted">Kerjakan soal</small>
        </div>
      </a>
    </div>

    <div class="col-6 col-md-3">
      <a href="tryout.html" class="text-decoration-none text-dark">
        <div class="card p-3 menu-card">
          <div class="icon-box bg-warning">
            <i class="bi bi-alarm"></i>
          </div>
          <h6>Try Out</h6>
          <small class="text-muted">Ujian simulasi</small>
        </div>
      </a>
    </div>

    <div class="col-6 col-md-3">
      <a href="hasil.html" class="text-decoration-none text-dark">
        <div class="card p-3 menu-card">
          <div class="icon-box bg-info">
            <i class="bi bi-bar-chart"></i>
          </div>
          <h6>Hasil Saya</h6>
          <small class="text-muted">Nilai & progres</small>
        </div>
      </a>
    </div>

  </div>

</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
