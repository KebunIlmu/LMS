<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Siswa Modern</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e0ecff, #f8fbff);
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .header-card {
      background: linear-gradient(135deg,#4facfe,#00f2fe);
      color: white;
    }

    .menu-card {
      transition: 0.25s;
    }

    .menu-card:hover {
      transform: scale(1.05);
    }

    .icon-box {
      width: 55px;
      height: 55px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      margin-bottom: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,.15);
    }

    .progress {
      background: rgba(255,255,255,0.3);
      border-radius: 20px;
    }

    .progress-bar {
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      transition: width 1s ease;
    }

    .stat-card {
      color: white;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
    }

    .small-list li {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<div class="container py-4">

  <!-- HEADER -->
  <div class="card header-card p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h4 class="mb-1">Halo, <span id="namaSiswa"></span> 👋</h4>
        <small>Kelas <span id="kelasSiswa"></span></small>
      </div>
      <button id="logoutBtn" class="btn btn-light btn-sm rounded-pill">Logout</button>
    </div>
  </div>

  <!-- STAT -->
  <div class="row g-3 mb-4">

    <div class="col-6 col-md-3">
      <div class="card stat-card p-3" style="background:linear-gradient(135deg,#667eea,#764ba2)">
        <div class="d-flex justify-content-between">
          <div>
            <small>Total Latihan</small>
            <h4 id="totalLatihan">0</h4>
          </div>
          <i class="bi bi-book fs-2"></i>
        </div>
        <div class="progress mt-2" style="height:18px;">
          <div id="barLatihan" class="progress-bar bg-success"></div>
        </div>
      </div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card stat-card p-3" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">
        <div class="d-flex justify-content-between">
          <div>
            <small>Tryout</small>
            <h4 id="totalTryout">0</h4>
          </div>
          <i class="bi bi-alarm fs-2"></i>
        </div>
        <div class="progress mt-2" style="height:18px;">
          <div id="barTryout" class="progress-bar bg-warning"></div>
        </div>
      </div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card stat-card p-3" style="background:linear-gradient(135deg,#f7971e,#ffd200)">
        <div class="d-flex justify-content-between">
          <div>
            <small>Rata-rata</small>
            <h4 id="avgNilai">0</h4>
          </div>
          <i class="bi bi-star fs-2"></i>
        </div>
        <div class="progress mt-2" style="height:18px;">
          <div id="barNilai" class="progress-bar bg-dark"></div>
        </div>
      </div>
    </div>

    <div class="col-6 col-md-3">
      <div class="card stat-card p-3" style="background:linear-gradient(135deg,#36d1dc,#5b86e5)">
        <div class="d-flex justify-content-between">
          <div>
            <small>Progress</small>
            <h4 id="progressBelajar">0%</h4>
          </div>
          <i class="bi bi-graph-up fs-2"></i>
        </div>
        <div class="progress mt-2" style="height:18px;">
          <div id="barProgress" class="progress-bar bg-primary"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="row g-4">

    <!-- MENU -->
    <div class="col-lg-8">
      <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
          <a href="materi-siswa.html" class="text-decoration-none text-dark">
            <div class="card p-3 menu-card text-center">
              <div class="icon-box bg-primary"><i class="bi bi-book"></i></div>
              <small>Materi</small>
            </div>
          </a>
        </div>

        <div class="col-6 col-md-3">
          <a href="latihan.html" class="text-decoration-none text-dark">
            <div class="card p-3 menu-card text-center">
              <div class="icon-box bg-success"><i class="bi bi-pencil"></i></div>
              <small>Latihan</small>
            </div>
          </a>
        </div>

        <div class="col-6 col-md-3">
          <a href="tryout.html" class="text-decoration-none text-dark">
            <div class="card p-3 menu-card text-center">
              <div class="icon-box bg-warning"><i class="bi bi-alarm"></i></div>
              <small>Tryout</small>
            </div>
          </a>
        </div>

        <div class="col-6 col-md-3">
          <a href="hasil.html" class="text-decoration-none text-dark">
            <div class="card p-3 menu-card text-center">
              <div class="icon-box bg-info"><i class="bi bi-bar-chart"></i></div>
              <small>Hasil</small>
            </div>
          </a>
        </div>

      </div>

      <div class="card p-3">
        <h6>📅 Jadwal Hari Ini</h6>
        <ul id="jadwalList" class="small-list"></ul>
      </div>
    </div>

    <!-- KANAN -->
    <div class="col-lg-4">

      <div class="card p-3 mb-3">
        <h6>🔔 Notifikasi</h6>
        <ul id="notifList" class="small-list"></ul>
      </div>

      <div class="card p-3 mb-3">
        <h6>📢 Pengumuman</h6>
        <div id="pengumumanList"></div>
      </div>

      <div class="card p-3">
        <h6>🏆 Ranking</h6>
        <ol id="rankingList"></ol>
      </div>

    </div>

  </div>

</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
