<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>📊 Hasil Latihan & Try Out</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f5f7fa; }
    .card-stat { border-radius: 12px; }
    .tab-content { margin-top: 1rem; }
    table th, table td { vertical-align: middle !important; }
    .badge { font-size: 0.9rem; }
    @media (max-width: 768px) {
      .table-responsive { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container my-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>📊 Hasil Saya</h4>
    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">← Kembali</a>
  </div>

  <!-- Statistik Cards -->
  <div class="row g-3 mb-3">
    <div class="col-md-4 col-6">
      <div class="card shadow-sm p-3 card-stat text-center">
        <h6>Total Latihan</h6>
        <h4 id="statLatihan">0</h4>
      </div>
    </div>
    <div class="col-md-4 col-6">
      <div class="card shadow-sm p-3 card-stat text-center">
        <h6>Total Try Out</h6>
        <h4 id="statTryout">0</h4>
      </div>
    </div>
    <div class="col-md-4 col-6">
      <div class="card shadow-sm p-3 card-stat text-center">
        <h6>Rata-Rata Nilai</h6>
        <h4 id="statAvg">0</h4>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="hasilTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="latihan-tab" data-bs-toggle="tab"
        data-bs-target="#latihan-tab-pane" type="button" role="tab">Latihan</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tryout-tab" data-bs-toggle="tab"
        data-bs-target="#tryout-tab-pane" type="button" role="tab">Try Out</button>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="latihan-tab-pane" role="tabpanel">
      <div class="table-responsive mt-2">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Latihan</th>
              <th>Mapel</th>
              <th>Nilai</th>
              <th>Tanggal</th>
            </tr>
          </thead>
          <tbody id="latihanTable"></tbody>
        </table>
        <div id="emptyLatihan" class="text-center text-muted py-4">😅 Belum ada Latihan</div>
      </div>
    </div>
    <div class="tab-pane fade" id="tryout-tab-pane" role="tabpanel">
      <div class="table-responsive mt-2">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Try Out</th>
              <th>Mapel</th>
              <th>Nilai</th>
              <th>Tanggal</th>
            </tr>
          </thead>
          <tbody id="tryoutTable"></tbody>
        </table>
        <div id="emptyTryout" class="text-center text-muted py-4">😅 Belum ada Try Out</div>
      </div>
    </div>
  </div>

</div>

<!-- Scripts -->
<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="./hasil.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
