<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hasil Latihan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">📊 Hasil Latihan Saya</h4>
    <a href="dashboard.html" class="btn btn-sm btn-outline-secondary">← Kembali</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Latihan</th>
            <th>Mapel</th>
            <th>Nilai</th>
            <th>Tanggal</th>
          </tr>
        </thead>
        <tbody id="hasilTable"></tbody>
      </table>

      <div id="emptyState"
        class="text-center text-muted py-4"
        style="display:none">
        😅 Kamu belum mengerjakan latihan apa pun
      </div>

    </div>
  </div>

</div>

<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="hasil.js"></script>

</body>
</html>
