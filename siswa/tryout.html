<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tryout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>

body{
background:#f0f2f5;
font-family:Inter, sans-serif;
}

/* LIST TRYOUT */

.tryout-card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:16px;
box-shadow:0 4px 14px rgba(0,0,0,.08);
cursor:pointer;
}

.tryout-card:hover{
background:#f9fafb;
}

/* TIMER */

.timer{
font-size:20px;
font-weight:700;
color:#dc2626;
}

/* SOAL */

.soal-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.opsi-container{
margin-top:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.option{
border:2px solid #e5e7eb;
padding:12px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.option:hover{
background:#dbeafe;
border-color:#3b82f6;
}

.option.active{
background:#bfdbfe;
border-color:#2563eb;
font-weight:600;
}

/* NAVIGASI */

.nav-soal{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:20px;
}

.nav-soal button{
width:40px;
height:40px;
font-size:14px;
border:none;
background:#e5e7eb;
border-radius:6px;
}

.nav-soal .active{
background:#2563eb;
color:white;
font-weight:bold;
}

.nav-soal .answered{
background:#22c55e;
color:white;
}
input[type="checkbox"]{
transform:scale(1.4);
margin-right:10px;
cursor:pointer;
}

label{
display:flex;
align-items:center;
gap:8px;
}
</style>
</head>

<body>

<div class="container py-4">

<div class="d-flex justify-content-between mb-3">
<h4>📝 Tryout</h4>
<a href="dashboard.html" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
</div>

<!-- LIST TRYOUT -->
<div id="tryoutList"></div>

<!-- CONTAINER SOAL -->
<div id="tryoutContainer" style="display:none;">

<div class="d-flex justify-content-between mb-3">

<div>
<h5 id="judulTryout"></h5>
<small id="mapelTryout"></small>
</div>

<div class="timer" id="timer">00:00</div>

</div>

<div class="soal-card">

<div id="soalBox"></div>

<div class="d-flex gap-2 mt-3">

<button id="prevBtn" class="btn btn-secondary">Sebelumnya</button>

<button id="nextBtn" class="btn btn-primary">Selanjutnya</button>

<button id="submitBtn" class="btn btn-success ms-auto">Submit</button>

</div>

</div>

<div class="nav-soal" id="navSoal"></div>

</div>
<div id="hasilContainer" style="display:none;" class="mt-4">

<h4>📊 Hasil Tryout</h4>

<div class="alert alert-success">
Nilai kamu: <b id="nilaiAkhir"></b>
</div>

<div id="reviewSoal"></div>

</div>
</div>

<script type="module" src="tryout.js"></script>

</body>
</html>
