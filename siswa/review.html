<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Review Latihan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f5f7fb}
.card{border-radius:18px;border:none;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.correct{background:#dcfce7;border-left:5px solid #16a34a}
.wrong{background:#fee2e2;border-left:5px solid #dc2626}
.answer{padding:8px;border-radius:8px;margin-bottom:6px}
</style>
</head>

<body>

<div class="container py-4">

  <div class="card p-4 mb-3">
    <h4>Hasil Latihan</h4>
    <p class="mb-1">Nilai: <strong id="score">-</strong></p>
    <p class="mb-0">Benar: <span id="benar"></span> / <span id="total"></span></p>
  </div>

  <div id="reviewBox"></div>

  <a href="dashboard.html" class="btn btn-primary w-100 mt-4">
    Kembali ke Dashboard
  </a>

</div>

<script type="module" src="review.js"></script>
</body>
</html>
