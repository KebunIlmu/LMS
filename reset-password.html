<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card p-4 shadow-sm rounded-4">
        <h5 class="text-center mb-3">Reset Password</h5>

        <form id="resetForm">
          <input type="email" id="email" class="form-control mb-3" placeholder="Email terdaftar" required>
          <button class="btn btn-primary w-100">Kirim Link Reset</button>
        </form>

        <p class="text-center mt-3">
          <a href="index.html">Kembali ke Login</a>
        </p>
      </div>

    </div>
  </div>
</div>

<script type="module" src="assets/js/reset-password.js"></script>
</body>
</html>
