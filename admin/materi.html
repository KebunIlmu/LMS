<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tambah Materi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h3>Tambah Materi</h3>

  <div class="mb-3">
    <label>Judul Materi</label>
    <input type="text" id="judulMateri" class="form-control">
  </div>

  <div class="mb-3">
    <label>Deskripsi</label>
    <textarea id="deskripsiMateri" class="form-control"></textarea>
  </div>

  <div class="mb-3">
    <label>Upload PDF</label>
    <input type="file" id="pdfMateri" class="form-control" accept="application/pdf">
  </div>

  <div class="mb-3">
    <label>Atau Link PDF (Drive)</label>
    <input type="text" id="pdfDrive" class="form-control">
  </div>

  <div class="mb-3">
    <label>YouTube Video ID (opsional)</label>
    <input type="text" id="youtubeId" class="form-control" placeholder="contoh: dQw4w9WgXcQ">
  </div>

  <div class="mb-3">
    <label>Import Latihan (JSON)</label>
    <input type="file" id="jsonLatihan" class="form-control" accept=".json">
  </div>

  <button id="btnPreview" class="btn btn-outline-primary me-2">
    👁 Preview
  </button>

  <button id="btnSimpanMateri" class="btn btn-success">
    💾 Simpan Materi
  </button>

  <hr class="my-4">

  <!-- PREVIEW -->
  <h5>Preview Materi</h5>

  <div id="previewPdf" style="display:none" class="mb-3">
    <iframe id="pdfFrame" style="width:100%; height:400px;"></iframe>
  </div>

  <div id="previewVideo" style="display:none" class="mb-3">
    <div class="ratio ratio-16x9">
      <iframe id="videoFrame" allowfullscreen></iframe>
    </div>
  </div>

  <div id="previewLatihan" style="display:none">
    <ul id="latihanList" class="list-group"></ul>
  </div>
</div>

<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="js/materi.js"></script>
</body>
</html>
