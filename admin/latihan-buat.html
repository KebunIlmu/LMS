<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buat Latihan - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f7fb; }
    .card { border-radius:12px; border:none; box-shadow:0 6px 15px rgba(0,0,0,.05); }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="card p-4">
    <h4 class="mb-3">Buat Latihan (Import JSON)</h4>

    <div class="mb-2">
      <input type="text" id="judul" class="form-control" placeholder="Judul Latihan">
    </div>

    <div class="mb-2">
      <input type="text" id="mapel" class="form-control" placeholder="Mata Pelajaran">
    </div>

    <div class="mb-2">
      <input type="text" id="bab" class="form-control" placeholder="Bab / Materi">
    </div>

    <div class="mb-2">
      <input type="text" id="kelas" class="form-control" placeholder="Kelas">
    </div>

    <div class="mb-2">
      <input type="file" id="jsonFile" accept=".json" class="form-control">
    </div>

    <button id="importJson" class="btn btn-primary w-100">Import & Simpan Latihan</button>

    <p class="text-muted mt-3">
      Pastikan file JSON sesuai format bank soal.
    </p>
  </div>
</div>

<script type="module">
import { db } from "../../assets/js/firebase.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const importBtn = document.getElementById("importJson");
const fileInput = document.getElementById("jsonFile");
const judul = document.getElementById("judul");
const mapel = document.getElementById("mapel");
const bab = document.getElementById("bab");
const kelas = document.getElementById("kelas");

importBtn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) return alert("Pilih file JSON terlebih dahulu");

  const text = await file.text();
  let soalArray;
  try {
    soalArray = JSON.parse(text);
  } catch (err) {
    return alert("Format JSON salah");
  }

  if (!judul.value || !mapel.value || !bab.value || !kelas.value) {
  return alert("Lengkapi judul, mapel, bab, dan kelas");
  }


  await addDoc(collection(db, "latihan"), {
    judul: judul.value,
    mapel: mapel.value,
    bab: bab.value,
    kelas: kelas.value,
    aktif: false,
    soal: soalArray,
    createdAt: serverTimestamp()
  });

  alert("Latihan berhasil disimpan dari JSON");
  location.href = "latihan.html";
};
</script>

</body>
</html>
