<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelola Akun</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Tombol toggle MOBILE -->
<button id="toggleSidebar" class="btn btn-outline-primary d-md-none m-2">
  ☰
</button>

<!-- OVERLAY -->
<div id="overlay"></div>

<div class="admin-wrapper">

  <!-- SIDEBAR LANGSUNG -->
  <div class="sidebar">

    <div class="sidebar-header">
      <span class="logo">LMS Admin</span>
    </div>

    <ul class="menu">
      <li><a href="dashboard.html" class="active">🏠 Dashboard</a></li>
      <li><a href="users.html">👥 Akun</a></li>
      <li><a href="classes.html">🏫 Kelas</a></li>
      <li><a href="materi.html">📚 Materi</a></li>
      <li><a href="laporan.html">📊 Laporan</a></li>
    </ul>

    <div class="sidebar-footer">
      <a href="../index.html">🚪 Logout</a>
    </div>

  </div>

  <div class="content">
    <h4>Kelola Akun</h4>
    <p class="text-muted">Manajemen akun siswa & guru</p>

    <!-- ================= IMPORT AKUN ================= -->
    <div class="card mb-4 shadow-sm rounded-4">
      <div class="card-body">
        <h6 class="mb-2">Import Akun (Excel)</h6>
        <input type="file" id="fileInput" class="form-control mb-2" accept=".xlsx">
        <button id="importBtn" class="btn btn-success btn-sm">
          Import Akun
        </button>
        <div id="log" class="mt-2 small"></div>
      </div>
    </div>

    <!-- ================= TABEL USER ================= -->
    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Nama</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>

  </div>
</div>

<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="js/auth-admin.js"></script>

<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- SCRIPT -->
<script type="module" src="js/users.js"></script>
<script type="module" src="js/import-users.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
