<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kelola Kelas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<button id="toggleSidebar" class="btn btn-outline-primary d-md-none m-2">☰</button>
<div id="overlay"></div>

<div class="admin-wrapper">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="logo">LMS Admin</span>
    </div>
    <ul class="menu">
      <li><a href="dashboard.html">🏠 Dashboard</a></li>
      <li><a href="users.html">👥 Akun</a></li>
      <li><a href="classes.html" class="active">🏫 Kelas</a></li>
      <li><a href="materi.html">📚 Materi</a></li>
      <li><a href="laporan.html">📊 Laporan</a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="../index.html">🚪 Logout</a>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <h4>Kelola Kelas</h4>
    <p class="text-muted">Buat kelas dan kelola anggotanya</p>

    <!-- FORM -->
    <div class="card mb-4 p-3 shadow-sm rounded-4">
      <div class="row g-2">
        <div class="col-md-4">
          <input id="namaKelas" class="form-control" placeholder="Nama Kelas">
        </div>
        <div class="col-md-4">
          <input id="tingkat" class="form-control" placeholder="Tingkat">
        </div>
        <div class="col-md-4">
          <input id="jurusan" class="form-control" placeholder="Jurusan">
        </div>
      </div>
      <button id="btnCreate" class="btn btn-success mt-3">Buat Kelas</button>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Nama</th>
          <th>Tingkat</th>
          <th>Jurusan</th>
          <th width="260">Aksi</th>
        </tr>
      </thead>
      <tbody id="classTable"></tbody>
    </table>
  </div>
</div>

<!-- MODAL TAMBAH -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Tambah Anggota</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <select id="memberRole" class="form-select mb-3">
          <option value="">-- Pilih Role --</option>
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
        </select>

        <select id="memberSelect" class="form-select" multiple style="height:200px"></select>
      </div>
      <div class="modal-footer">
        <button id="btnAddMemberModal" class="btn btn-success">Tambahkan</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL VIEW -->
<div class="modal fade" id="viewMembersModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Anggota Kelas</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <h6>Siswa</h6>
        <ul id="siswaList" class="list-group mb-3"></ul>
        <h6>Guru</h6>
        <ul id="guruList" class="list-group"></ul>
      </div>
    </div>
  </div>
</div>

<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="js/classes.js"></script>
<script src="js/sidebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
